<h2><a name="Description:"></a><span class="mw-headline"><font color="chocolate">Description:</font></span></h2>
<p>INV for Rayleigh
</p>
<h2><a name="Syntax:"></a><span class="mw-headline"><font color="chocolate">Syntax:</font></span></h2>
<pre class="lt" style="font-family:monospace;">double raylinv<span style="color: #000000;">&#40;</span>double dP, double b<span style="color: #000000;">&#41;</span></pre>
<h2><a name="Parameters:"></a><span class="mw-headline"><font color="chocolate">Parameters:</font></span></h2>
<dl><dt>dP (input, double)</dt>
<dd>The target probability value</dd>
<dt>b (input, double)</dt>
<dd>The scale parameter of the Rayleigh distribution. It must be a positive number (b &gt; 0).</dd></dl>
