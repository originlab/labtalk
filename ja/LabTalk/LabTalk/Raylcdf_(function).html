<h1 class="firstHeading">Raylcdf</h1><p class='urlname' style='display: none'>raylcdf-func</p>
<h2><a name="Description:"></a><span class="mw-headline"><font color="chocolate">概要</font></span></h2>
<p>レイリー分布の累積分布関数
</p>
<h2><a name="Syntax:"></a><span class="mw-headline"><font color="chocolate">構文</font></span></h2>
<pre class="lt" style="font-family:monospace;">double raylcdf<span style="color: #000000;">(</span>double x, double b<span style="color: #000000;">[</span>, int iTail<span style="color: #000000;">]</span><span style="color: #000000;">)</span></pre>
<h2><a name="Parameters:"></a><span class="mw-headline"><font color="chocolate">パラメータ</font></span></h2>
<dl><dt>x (input, double)</dt>
<dd>x変数の値。</dd>
<dt>b (input, double)</dt>
<dd>レイリー分布の尺度母数（σ または scale）（b &gt; 0）。</dd>
<dt>iTail (input, int)</dt>
<dd>テールタイプ、0=両方、1=上部、2=下部（デフォルト）</dd></dl>
