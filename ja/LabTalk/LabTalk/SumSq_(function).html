<h2><a name="Description"></a><span class="mw-headline"><font color="chocolate">概要</font></span></h2>
<p>データセットの平方和を返します。
</p>
<h2><a name="Syntax"></a><span class="mw-headline"><font color="chocolate">構文</font></span></h2>
<pre class="lt" style="font-family:monospace;">double SumSq<span style="color: #000000;">(</span>dataset vd<span style="color: #000000;">[</span>, dataset vd2,...<span style="color: #000000;">]</span><span style="color: #000000;">)</span>;</pre>
<h2><a name="Parameter"></a><span class="mw-headline"><font color="chocolate">パラメータ</font></span></h2>
<p><b>vd</b>
</p>
<dl><dd>データセット、またはOriginワークシート内の列</dd></dl>
<h2><a name="Return"></a><span class="mw-headline"><font color="chocolate">戻り値</font></span></h2>
<p><b>vd</b>内の個々の値の平方和を返します。
</p>
<h2><a name="Examples"></a><span class="mw-headline"><font color="chocolate">サンプル</font></span></h2>
<pre class="lt" style="font-family:monospace;">double sumSq <span style="color: #000080;">=</span> SumSq<span style="color: #000000;">(</span>col<span style="color: #000000;">(</span>A<span style="color: #000000;">)</span>,col<span style="color: #000000;">(</span>B<span style="color: #000000;">)</span><span style="color: #000000;">)</span>;</pre>
