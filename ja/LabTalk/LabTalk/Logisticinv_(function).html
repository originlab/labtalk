<h1 class="firstHeading">Logisticinv</h1><p class='urlname' style='display: none'>logisticinv-func</p>
<h2><a name="Description:"></a><span class="mw-headline"><font color="chocolate">概要</font></span></h2>
<p>ロジスティックの逆関数
</p>
<h2><a name="Syntax:"></a><span class="mw-headline"><font color="chocolate">構文</font></span></h2>
<pre class="lt" style="font-family:monospace;">double logisticinv<span style="color: #000000;">(</span>double dP, double mu, double sigma<span style="color: #000000;">)</span></pre>
<h2><a name="Parameters:"></a><span class="mw-headline"><font color="chocolate">パラメータ</font></span></h2>
<dl><dt>dP (input, double)</dt>
<dd>目標確率の値</dd>
<dt>mu (input, double)</dt>
<dd>分布の平均(中央値)を表すロケーションパラメータ。</dd>
<dt>sigma (input, double)</dt>
<dd>標準偏差に比例する正のスケールパラメータ。</dd></dl>
