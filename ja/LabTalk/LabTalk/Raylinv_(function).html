<h1 class="firstHeading">Raylinv</h1><p class='urlname' style='display: none'>raylinv-func</p>
<h2><a name="Description:"></a><span class="mw-headline"><font color="chocolate">概要</font></span></h2>
<p>レイリー分布の逆関数
</p>
<h2><a name="Syntax:"></a><span class="mw-headline"><font color="chocolate">構文</font></span></h2>
<pre class="lt" style="font-family:monospace;">double raylinv<span style="color: #000000;">(</span>double dP, double b<span style="color: #000000;">)</span></pre>
<h2><a name="Parameters:"></a><span class="mw-headline"><font color="chocolate">パラメータ</font></span></h2>
<dl><dt>dP (input, double)</dt>
<dd>目標確率の値</dd>
<dt>b (input, double)</dt>
<dd>レイリー分布のスケールパラメータ。値は正である必要があります (b &gt; 0)。</dd></dl>
