<h1 class="firstHeading">Levcdf</h1><p class='urlname' style='display: none'>levcdf-func</p>
<h2><a name="Description:"></a><span class="mw-headline"><font color="chocolate">概要</font></span></h2>
<p>最大極値の累積分布関数
</p>
<h2><a name="Syntax:"></a><span class="mw-headline"><font color="chocolate">構文</font></span></h2>
<pre class="lt" style="font-family:monospace;">double levcdf<span style="color: #000000;">(</span>double x, double mu, double sigma<span style="color: #000000;">[</span>, int iTail<span style="color: #000000;">]</span><span style="color: #000000;">)</span></pre>
<h2><a name="Parameters:"></a><span class="mw-headline"><font color="chocolate">パラメータ</font></span></h2>
<dl><dt>x (input, double)</dt>
<dd>x変数の値。</dd>
<dt>mu (input, double)</dt>
<dd>分布のロケーションパラメータ。</dd>
<dt>sigma (input, double)</dt>
<dd>分布のスケールパラメータ（正の値でである必要があります）。</dd>
<dt>iTail (input, int)</dt>
<dd>テールタイプ、0=両側、1=上側、2=下側（デフォルト）</dd></dl>
